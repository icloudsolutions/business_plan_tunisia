<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#1e3a5f,#0f2744);padding:20px 24px;">
              <p style="margin:0;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#d4a853;">Business Plan Tunisie</p>
              <h1 style="margin:8px 0 0;font-size:20px;font-weight:600;color:#ffffff;line-height:1.3;">{{ title_fr }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;color:#334155;font-size:15px;line-height:1.6;">
              {% block body_fr %}{% endblock %}
              {% if cta_url %}
              <p style="margin:28px 0 8px;">
                <a href="{{ cta_url }}" style="display:inline-block;background:#d4a853;color:#0f2744;text-decoration:none;font-weight:600;font-size:14px;padding:12px 24px;border-radius:8px;">{{ cta_label_fr }}</a>
              </p>
              {% endif %}
              <p style="margin:24px 0 0;font-size:12px;color:#94a3b8;">{{ footer_fr }}</p>
            </td>
          </tr>
          <tr>
            <td style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:20px 24px;" dir="rtl">
              <p style="margin:0 0 8px;font-size:11px;letter-spacing:0.06em;color:#64748b;text-align:right;">خطة الأعمال تونس</p>
              <h2 style="margin:0 0 12px;font-size:18px;font-weight:600;color:#1e3a5f;text-align:right;">{{ title_ar }}</h2>
              <div style="font-size:14px;line-height:1.7;color:#475569;text-align:right;">
                {% block body_ar %}{% endblock %}
              </div>
              {% if cta_url %}
              <p style="margin:20px 0 8px;text-align:right;">
                <a href="{{ cta_url }}" style="display:inline-block;background:#1e3a5f;color:#ffffff;text-decoration:none;font-weight:600;font-size:13px;padding:10px 20px;border-radius:8px;">{{ cta_label_ar }}</a>
              </p>
              {% endif %}
            </td>
          </tr>
        </table>
        {% if tracking_pixel_url %}
        <img src="{{ tracking_pixel_url }}" width="1" height="1" alt="" style="display:block;width:1px;height:1px;border:0;" />
        {% endif %}
      </td>
    </tr>
  </table>
</body>
</html>
